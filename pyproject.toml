[project]
name = "biosciences-temporal"
version = "0.1.0"
description = "Temporal workflows for biosciences research using Pydantic AI and MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.0",
    "pydantic-ai[temporal]>=2.62.0",
    "temporalio>=1.34.0",
    "httpx>=0.28.0",
    "logfire>=5.4.0",
    "python-dotenv>=1.2.0",
    "typesafe-sdk>=0.7.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "pyright>=1.1.400",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biosciences_temporal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
